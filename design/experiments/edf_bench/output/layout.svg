<circle cx="343.0" cy="317.0" r="5" fill="#15243a"/>
<text x="85" y="266" class="small">Calibration point: 120 left of pivot</text>
<line x1="210" y1="273" x2="343.0" y2="310.0" stroke="#1e3a5f" stroke-width="2" stroke-dasharray="6 5"/>
<text x="45" y="640" class="label">Thrust (g-force) = (gross scale g − baseline g) × L / h</text>
<text x="45" y="674" class="small">Here: thrust = 2 × change in scale reading. Example: +500 g on scale means 1,000 g-force thrust.</text>
<text x="45" y="709" class="small">Record gross baseline before taring. Proposed working stop: 1,800 g gross; scale capacity: 2,000 g.</text>
<text x="45" y="744" class="small">Calibrate the complete mechanism and check return-to-zero. Friction, cable forces and vibration can bias it.</text>
<text x="45" y="779" class="small">The moving lever and fan mount contact the fixed structure only through the pivot and scale pad.</text>
<text x="45" y="814" class="small">Base allowance: 600 × 320 × 18. Use bolted timber/metal sections, bought bearings/shaft, and fitted adapters.</text>
</svg>